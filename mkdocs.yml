site_name: AWS Infra Demos
docs_dir: ./src_docs
nav:
    - Home: index.md
    - Bash Examples: 
        - 01 Getting AMIs : bash_examples/01_retrieveAMIs.md
        - 02 Pushing Images to ECR: bash_examples/02_push_streamlit_app_to_ECR.md
    - Terraform Examples: 
        - 01 Backend Setup : terraform_examples/01_SetUpS3Backend.md
        - 02 Create your server: terraform_examples/02_PrivateServer.md
        - 03 ECR Setup: terraform_examples/03_ECR.md
        - 04 ECS Service: terraform_examples/04_ECS.md
theme:
  name: "material"
dev_addr: '0.0.0.0:8080'
markdown_extensions:
    - attr_list
    - toc:
        permalink: "#"
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
    - admonition
    - pymdownx.details
    - pymdownx.inlinehilite
    - pymdownx.snippets
extra_css:
  - stylesheets/extra.css
extra_javascript:
    - src_docs/mathjax.js
    - https://polyfill.io/v3/polyfill.min.js?features=es6
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
    - search